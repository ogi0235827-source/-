<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowl - 専門知識をシェアする</title>
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --text: #14161a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-weak: #eaf0ff;
    --verified: #1d9bf0;
    --q: #ea8a00;
    --q-weak: #fff4e2;
    --a: #7c3aed;
    --a-weak: #f2ecfe;
    --danger: #dc2626;
    --radius: 14px;
    --radius-sm: 9px;
    --gap: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
    --maxw: 640px;
    --tabbar-h: 60px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: none; cursor: pointer; }
  a { color: var(--primary); }

  /* ---------- Shell ---------- */
  #app {
    max-width: var(--maxw);
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 0 1px var(--border);
  }

  #topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
    min-height: 56px;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 18px; letter-spacing: .2px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    color: #fff; font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .topbar-title { font-weight: 700; font-size: 16px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }

  .iconbtn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); flex: none;
  }
  .iconbtn:hover { background: var(--surface-2); }

  .account-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 4px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 12px; font-weight: 600; flex: none;
  }
  .account-btn .avatar { width: 26px; height: 26px; font-size: 15px; }

  main { flex: 1; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); }

  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    max-width: var(--maxw); margin: 0 auto;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: rgba(255,255,255,.96);
    backdrop-filter: saturate(180%) blur(10px);
    border-top: 1px solid var(--border);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; font-weight: 600; color: var(--muted);
    position: relative;
  }
  .tab.active { color: var(--primary); }
  .tab-badge {
    position: absolute; top: 6px; left: 50%; margin-left: 3px;
    min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 999px; background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
  }
  .tab-compose svg { color: #fff; }
  .tab-compose .compose-dot {
    width: 30px; height: 30px; border-radius: 10px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Common bits ---------- */
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; flex: none; line-height: 1;
  }
  .avatar.lg { width: 66px; height: 66px; font-size: 34px; }

  .verified-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--verified); color: #fff; flex: none;
    vertical-align: -2px;
  }
  .verified-badge svg { width: 10px; height: 10px; }

  .name-line { display: flex; align-items: center; gap: 4px; min-width: 0; flex-wrap: wrap; }
  .name { font-weight: 700; font-size: 14px; }
  .handle, .meta { color: var(--muted); font-size: 12px; }

  .chip-row {
    display: flex; gap: 7px; overflow-x: auto; padding: 10px 14px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
  }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .segment {
    display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 56px; z-index: 20;
  }
  .segment button {
    flex: 1; padding: 12px 0; font-size: 14px; font-weight: 700; color: var(--muted);
    border-bottom: 2.5px solid transparent;
  }
  .segment button.active { color: var(--text); border-bottom-color: var(--primary); }

  .sortbar { display: flex; gap: 8px; padding: 0 14px 6px; align-items: center; }
  .sortbar .lbl { font-size: 12px; color: var(--muted); margin-right: auto; }
  .sortbtn { font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 9px; border-radius: 999px; }
  .sortbtn.active { color: var(--primary); background: var(--primary-weak); }

  .list { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 20px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px;
  }
  .card.tappable:active { background: var(--surface-2); }

  .kind {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px;
  }
  .kind.question { background: var(--q-weak); color: var(--q); }
  .kind.article { background: var(--a-weak); color: var(--a); }
  .kind.solved { background: #e7f8ef; color: #067647; }

  .post-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .post-title { font-size: 16px; font-weight: 700; line-height: 1.5; margin: 4px 0 6px; }
  .post-excerpt { color: #4b5563; font-size: 13.5px; line-height: 1.75;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .post-body { font-size: 15px; line-height: 1.9; white-space: normal; word-break: break-word; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 6px;
  }

  .post-foot { display: flex; align-items: center; gap: 16px; margin-top: 11px;
    padding-top: 10px; border-top: 1px solid var(--border); }
  .stat { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px;
    font-weight: 600; color: var(--muted); }
  .stat svg { width: 15px; height: 15px; }
  .stat.on { color: var(--danger); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    background: var(--primary); color: #fff; border: 1px solid var(--primary);
  }
  .btn:disabled { opacity: .45; }
  .btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn.sm { padding: 6px 13px; font-size: 12.5px; }
  .btn.block { width: 100%; padding: 13px; font-size: 15px; border-radius: 12px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 24px; font-size: 14px; }
  .empty .big { font-size: 34px; display: block; margin-bottom: 10px; }

  .section-title { font-size: 13px; font-weight: 800; color: var(--muted);
    padding: 18px 14px 6px; letter-spacing: .04em; }

  /* ---------- Forms ---------- */
  .field { padding: 0 14px 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field select {
    width: 100%; padding: 11px 13px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 15px; line-height: 1.7; outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); }
  .field textarea { resize: vertical; min-height: 170px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .typeswitch { display: flex; gap: 10px; padding: 14px; }
  .typecard {
    flex: 1; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px; text-align: left; background: var(--surface);
  }
  .typecard.active { border-color: var(--primary); background: var(--primary-weak); }
  .typecard .t { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .typecard .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.6; }

  /* ---------- Replies ---------- */
  .reply {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px; box-shadow: var(--shadow);
  }
  .reply.best { border-color: #a7e8c6; background: #f4fdf8; }
  .best-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px;
    font-weight: 800; color: #067647; margin-bottom: 7px; }
  .reply-body { font-size: 14px; line-height: 1.85; margin-top: 8px; word-break: break-word; }
  .reply-foot { display: flex; align-items: center; gap: 14px; margin-top: 10px; }

  /* ---------- Profile ---------- */
  .profile-head { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 16px; }
  .profile-top { display: flex; align-items: flex-start; gap: 14px; }
  .profile-name { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .verified-note {
    margin-top: 12px; background: #eff8ff; border: 1px solid #d1e9ff;
    border-radius: 11px; padding: 10px 12px; font-size: 12.5px; color: #175cd3; line-height: 1.7;
  }
  .counts { display: flex; gap: 20px; margin-top: 13px; }
  .counts b { font-size: 15px; }
  .counts span { font-size: 12.5px; color: var(--muted); }
  .fields { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .fieldtag { font-size: 11.5px; font-weight: 700; color: var(--primary);
    background: var(--primary-weak); padding: 3px 9px; border-radius: 7px; }

  .expert-card { display: flex; align-items: flex-start; gap: 12px; }
  .expert-card .col { flex: 1; min-width: 0; }
  .expert-bio { font-size: 12.5px; color: var(--muted); margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- Notifications ---------- */
  .noti { display: flex; gap: 11px; align-items: flex-start; padding: 13px 14px;
    background: var(--surface); border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
  .noti.unread { background: #f5f9ff; }
  .noti-text { flex: 1; font-size: 13.5px; line-height: 1.65; }
  .noti-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; margin-top: 7px; }

  /* ---------- Sheet ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(16,24,40,.42);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: var(--maxw); background: var(--surface);
    border-radius: 18px 18px 0 0; padding: 8px 0 calc(18px + env(safe-area-inset-bottom, 0px));
    max-height: 78vh; overflow-y: auto;
  }
  .sheet-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 12px; }
  .sheet-title { font-size: 15px; font-weight: 800; padding: 0 18px 4px; }
  .sheet-sub { font-size: 12px; color: var(--muted); padding: 0 18px 12px; line-height: 1.6; }
  .sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 18px; text-align: left; }
  .sheet-item:active { background: var(--surface-2); }
  .sheet-item.current { background: var(--primary-weak); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--tabbar-h) + 20px); z-index: 80;
    background: #14161a; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    white-space: nowrap; max-width: calc(100% - 40px);
    overflow: hidden; text-overflow: ellipsis;
  }

  @media (min-width: 700px) {
    #app { box-shadow: 0 0 0 1px var(--border), 0 8px 40px rgba(16,24,40,.06); }
  }
</style>
</head>
<body>

<div id="app">
  <header id="topbar"></header>
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>
<div id="layer"></div>

<script>
"use strict";

/* =====================================================================
   Knowl — 専門知識シェアプラットフォーム（プロトタイプ）

   構成は3層。層をまたいだ直接アクセスはしない。
     Store   : データの保存と読み出し（localStorage）。ここだけを
               将来 Supabase クライアントに差し替えれば本番化できる。
     Actions : 業務ロジック。通知レコードの生成もここに集約する。
     View    : 描画。state.route を見て画面を組み立て直すだけ。
   ===================================================================== */

/* ---------------------------------------------------------------
   ユーティリティ
   --------------------------------------------------------------- */

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

// ユーザー入力は必ずここを通してから innerHTML に載せる。
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function escMultiline(s) {
  return esc(s).replace(/\n/g, "<br>");
}

function excerpt(s, n) {
  const flat = String(s || "").replace(/\s+/g, " ").trim();
  return flat.length > n ? flat.slice(0, n) + "…" : flat;
}

function timeAgo(ts) {
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return "たった今";
  const min = Math.floor(sec / 60);
  if (min < 60) return min + "分前";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "時間前";
  const day = Math.floor(hr / 24);
  if (day < 30) return day + "日前";
  const mon = Math.floor(day / 30);
  if (mon < 12) return mon + "ヶ月前";
  return Math.floor(mon / 12) + "年前";
}

const ICON = {
  home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  users: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  bell: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
  user: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  heartFill: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.5-4.4A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  award: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M8.2 13.9 7 22l5-3 5 3-1.2-8.1"/></svg>',
  switchIcon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/></svg>'
};

function verifiedMark() {
  return '<span class="verified-badge" title="専門家認定">' + ICON.check + '</span>';
}

/* ---------------------------------------------------------------
   Store — データ層
   localStorage への読み書きはこの中だけで行う。
   --------------------------------------------------------------- */

const STORAGE_KEY = "knowl.v1";

const CATEGORIES = [
  { id: "it",      name: "IT・エンジニアリング", emoji: "💻" },
  { id: "med",     name: "医療・健康",           emoji: "🩺" },
  { id: "law",     name: "法律・税務",           emoji: "⚖️" },
  { id: "food",    name: "料理",                 emoji: "🍳" },
  { id: "edu",     name: "教育",                 emoji: "📚" },
  { id: "design",  name: "デザイン",             emoji: "🎨" },
  { id: "finance", name: "金融・投資",           emoji: "💹" },
  { id: "agri",    name: "農業・園芸",           emoji: "🌱" }
];

const Store = {
  data: null,

  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.users) && parsed.users.length) {
          this.data = parsed;
          this.data.categories = CATEGORIES; // カテゴリ定義は常に最新を使う
          return this.data;
        }
      } catch (e) { /* 壊れていたら作り直す */ }
    }
    this.data = buildSeed();
    this.save();
    return this.data;
  },

  save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); }
    catch (e) { /* プライベートモード等では保存できないが動作は継続する */ }
  },

  reset() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    this.data = buildSeed();
    this.save();
    return this.data;
  },

  /* --- 参照ヘルパー（読み取り専用） --- */
  users()          { return this.data.users; },
  categories()     { return this.data.categories; },
  posts()          { return this.data.posts; },
  replies()        { return this.data.replies; },
  follows()        { return this.data.follows; },
  notifications()  { return this.data.notifications; },

  me()             { return this.user(this.data.currentUserId); },
  user(id)         { return this.data.users.find(u => u.id === id) || null; },
  post(id)         { return this.data.posts.find(p => p.id === id) || null; },
  reply(id)        { return this.data.replies.find(r => r.id === id) || null; },
  category(id)     { return this.data.categories.find(c => c.id === id) || null; },

  repliesOf(postId) {
    return this.data.replies
      .filter(r => r.postId === postId)
      .sort((a, b) => a.createdAt - b.createdAt);
  },
  postsBy(userId) {
    return this.data.posts
      .filter(p => p.authorId === userId)
      .sort((a, b) => b.createdAt - a.createdAt);
  },
  isFollowing(followerId, followeeId) {
    return this.data.follows.some(f => f.followerId === followerId && f.followeeId === followeeId);
  },
  followingCount(userId) { return this.data.follows.filter(f => f.followerId === userId).length; },
  followerCount(userId)  { return this.data.follows.filter(f => f.followeeId === userId).length; },
  followingIds(userId)   { return this.data.follows.filter(f => f.followerId === userId).map(f => f.followeeId); },

  myNotifications() {
    return this.data.notifications
      .filter(n => n.userId === this.data.currentUserId)
      .sort((a, b) => b.createdAt - a.createdAt);
  },
  unreadCount() {
    return this.data.notifications.filter(n => n.userId === this.data.currentUserId && !n.read).length;
  }
};

/* ---------------------------------------------------------------
   Actions — ロジック層
   状態を変える操作はすべてここを通す。通知の生成もここで行う。
   --------------------------------------------------------------- */

const Actions = {
  notify(userId, type, actorId, postId) {
    if (userId === actorId) return; // 自分の行動は自分に通知しない
    Store.data.notifications.push({
      id: uid(), userId, type, actorId,
      postId: postId || null, createdAt: Date.now(), read: false
    });
  },

  switchUser(userId) {
    if (!Store.user(userId)) return;
    Store.data.currentUserId = userId;
    Store.save();
  },

  toggleFollow(targetId) {
    const meId = Store.data.currentUserId;
    if (meId === targetId) return;
    const i = Store.data.follows.findIndex(f => f.followerId === meId && f.followeeId === targetId);
    if (i >= 0) {
      Store.data.follows.splice(i, 1);
    } else {
      Store.data.follows.push({ followerId: meId, followeeId: targetId });
      this.notify(targetId, "follow", meId, null);
    }
    Store.save();
  },

  toggleLikePost(postId) {
    const meId = Store.data.currentUserId;
    const post = Store.post(postId);
    if (!post) return;
    const i = post.likes.indexOf(meId);
    if (i >= 0) post.likes.splice(i, 1);
    else { post.likes.push(meId); this.notify(post.authorId, "like", meId, post.id); }
    Store.save();
  },

  toggleLikeReply(replyId) {
    const meId = Store.data.currentUserId;
    const reply = Store.reply(replyId);
    if (!reply) return;
    const i = reply.likes.indexOf(meId);
    if (i >= 0) reply.likes.splice(i, 1);
    else { reply.likes.push(meId); this.notify(reply.authorId, "like", meId, reply.postId); }
    Store.save();
  },

  createPost(draft) {
    const post = {
      id: uid(),
      type: draft.type === "article" ? "article" : "question",
      authorId: Store.data.currentUserId,
      title: String(draft.title || "").trim(),
      body: String(draft.body || "").trim(),
      categoryId: draft.categoryId,
      tags: String(draft.tags || "")
        .split(/[,、\s]+/).map(t => t.replace(/^#/, "").trim())
        .filter(Boolean).slice(0, 5),
      createdAt: Date.now(),
      likes: [],
      bestReplyId: null
    };
    Store.data.posts.push(post);
    Store.save();
    return post;
  },

  addReply(postId, body) {
    const text = String(body || "").trim();
    const post = Store.post(postId);
    if (!post || !text) return null;
    const reply = {
      id: uid(), postId, authorId: Store.data.currentUserId,
      body: text, createdAt: Date.now(), likes: []
    };
    Store.data.replies.push(reply);
    this.notify(post.authorId, "reply", reply.authorId, postId);
    Store.save();
    return reply;
  },

  selectBest(postId, replyId) {
    const post = Store.post(postId);
    if (!post || post.type !== "question") return;
    if (post.authorId !== Store.data.currentUserId) return; // 質問者本人だけが選べる
    const reply = Store.reply(replyId);
    if (!reply || reply.postId !== postId) return;
    post.bestReplyId = (post.bestReplyId === replyId) ? null : replyId;
    if (post.bestReplyId) this.notify(reply.authorId, "best", post.authorId, postId);
    Store.save();
  }
};

/* ---------------------------------------------------------------
   View — 描画層
   --------------------------------------------------------------- */

const state = {
  route: { name: "home" },
  homeTab: "all",          // all | following
  homeCategory: null,
  homeSort: "new",         // new | hot
  expertField: null,
  sheet: null,             // null | 'accounts'
  toast: null,
  compose: { type: "question", title: "", body: "", categoryId: "it", tags: "" },
  replyDrafts: {}          // postId -> 入力中の本文
};

let toastTimer = null;
function toast(msg) {
  state.toast = msg;
  renderLayer();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; renderLayer(); }, 1900);
}

function go(route) {
  state.route = route;
  window.scrollTo(0, 0);
  render();
}

/* --- 小さな部品 --- */

function avatarHtml(user, cls) {
  return '<span class="avatar ' + (cls || "") + '">' + esc(user.emoji) + '</span>';
}

function userLineHtml(user, ts) {
  return '' +
    '<div class="name-line">' +
      '<span class="name">' + esc(user.name) + '</span>' +
      (user.verified ? verifiedMark() : "") +
      '<span class="handle">@' + esc(user.handle) + (ts ? " ・ " + timeAgo(ts) : "") + '</span>' +
    '</div>';
}

function kindBadge(post) {
  if (post.type === "article") return '<span class="kind article">記事</span>';
  if (post.bestReplyId) return '<span class="kind solved">解決済み</span>';
  return '<span class="kind question">質問</span>';
}

function statLike(count, on, action, id) {
  return '<button class="stat ' + (on ? "on" : "") + '" data-action="' + action + '" data-id="' + esc(id) + '">' +
    (on ? ICON.heartFill : ICON.heart) + '<span>' + count + '</span></button>';
}

function postCardHtml(post) {
  const author = Store.user(post.authorId);
  const cat = Store.category(post.categoryId);
  const replyCount = Store.repliesOf(post.id).length;
  const liked = post.likes.indexOf(Store.data.currentUserId) >= 0;

  return '' +
  '<article class="card tappable" data-action="open-post" data-id="' + esc(post.id) + '">' +
    '<div class="post-head">' +
      '<button class="avatar" data-action="open-profile" data-id="' + esc(author.id) + '">' + esc(author.emoji) + '</button>' +
      '<div style="flex:1;min-width:0">' + userLineHtml(author, post.createdAt) + '</div>' +
      kindBadge(post) +
    '</div>' +
    '<h2 class="post-title">' + esc(post.title) + '</h2>' +
    '<p class="post-excerpt">' + esc(excerpt(post.body, 100)) + '</p>' +
    '<div class="tags">' +
      (cat ? '<span class="tag">' + esc(cat.emoji + " " + cat.name) + '</span>' : "") +
      post.tags.map(t => '<span class="tag">#' + esc(t) + '</span>').join("") +
    '</div>' +
    '<div class="post-foot">' +
      statLike(post.likes.length, liked, "like-post", post.id) +
      '<span class="stat">' + ICON.chat + '<span>' + replyCount + '</span></span>' +
      '<span class="stat" style="margin-left:auto">' +
        (post.type === "question" ? "回答を見る" : "続きを読む") + '</span>' +
    '</div>' +
  '</article>';
}

/* --- 画面: ホーム --- */

function renderHome() {
  const meId = Store.data.currentUserId;
  const followingIds = Store.followingIds(meId);
  let posts = Store.posts().slice();

  if (state.homeTab === "following") {
    posts = posts.filter(p => followingIds.indexOf(p.authorId) >= 0 || p.authorId === meId);
  }
  if (state.homeCategory) {
    posts = posts.filter(p => p.categoryId === state.homeCategory);
  }
  if (state.homeSort === "hot") {
    posts.sort((a, b) =>
      (b.likes.length * 2 + Store.repliesOf(b.id).length * 3) -
      (a.likes.length * 2 + Store.repliesOf(a.id).length * 3));
  } else {
    posts.sort((a, b) => b.createdAt - a.createdAt);
  }

  const cats = Store.categories();
  let html = '' +
  '<div class="segment">' +
    '<button data-action="home-tab" data-value="all" class="' + (state.homeTab === "all" ? "active" : "") + '">すべて</button>' +
    '<button data-action="home-tab" data-value="following" class="' + (state.homeTab === "following" ? "active" : "") + '">フォロー中</button>' +
  '</div>' +
  '<div class="chip-row">' +
    '<button class="chip ' + (state.homeCategory === null ? "active" : "") + '" data-action="home-category" data-value="">すべての分野</button>' +
    cats.map(c => '<button class="chip ' + (state.homeCategory === c.id ? "active" : "") + '" data-action="home-category" data-value="' + c.id + '">' + esc(c.emoji + " " + c.name) + '</button>').join("") +
  '</div>' +
  '<div class="sortbar">' +
    '<span class="lbl">' + posts.length + '件</span>' +
    '<button class="sortbtn ' + (state.homeSort === "new" ? "active" : "") + '" data-action="home-sort" data-value="new">新着順</button>' +
    '<button class="sortbtn ' + (state.homeSort === "hot" ? "active" : "") + '" data-action="home-sort" data-value="hot">人気順</button>' +
  '</div>';

  if (!posts.length) {
    html += '<div class="empty"><span class="big">🗂️</span>' +
      (state.homeTab === "following"
        ? "フォロー中の専門家の投稿はまだありません。<br>「専門家」タブから気になる人をフォローしてみてください。"
        : "この分野の投稿はまだありません。") +
      '</div>';
  } else {
    html += '<div class="list">' + posts.map(postCardHtml).join("") + '</div>';
  }
  return html;
}

/* --- 画面: 投稿詳細 --- */

function renderPost() {
  const post = Store.post(state.route.id);
  if (!post) return '<div class="empty">投稿が見つかりませんでした。</div>';

  const author = Store.user(post.authorId);
  const cat = Store.category(post.categoryId);
  const meId = Store.data.currentUserId;
  const liked = post.likes.indexOf(meId) >= 0;
  const isOwner = post.authorId === meId;
  const isQuestion = post.type === "question";

  let replies = Store.repliesOf(post.id);
  // ベストアンサーは常に先頭に出す
  replies.sort((a, b) => {
    const ab = post.bestReplyId === a.id ? 1 : 0;
    const bb = post.bestReplyId === b.id ? 1 : 0;
    if (ab !== bb) return bb - ab;
    return a.createdAt - b.createdAt;
  });

  let html = '<div class="list">' +
  '<article class="card">' +
    '<div class="post-head">' +
      '<button class="avatar" data-action="open-profile" data-id="' + esc(author.id) + '">' + esc(author.emoji) + '</button>' +
      '<div style="flex:1;min-width:0">' + userLineHtml(author, post.createdAt) + '</div>' +
      kindBadge(post) +
    '</div>' +
    '<h1 class="post-title" style="font-size:19px">' + esc(post.title) + '</h1>' +
    '<div class="post-body">' + escMultiline(post.body) + '</div>' +
    '<div class="tags">' +
      (cat ? '<span class="tag">' + esc(cat.emoji + " " + cat.name) + '</span>' : "") +
      post.tags.map(t => '<span class="tag">#' + esc(t) + '</span>').join("") +
    '</div>' +
    '<div class="post-foot">' +
      statLike(post.likes.length, liked, "like-post", post.id) +
      '<span class="stat">' + ICON.chat + '<span>' + replies.length + '</span></span>' +
    '</div>' +
  '</article>';

  html += '<div class="section-title" style="padding-left:2px">' +
    (isQuestion ? "回答 " + replies.length + "件" : "コメント " + replies.length + "件") + '</div>';

  if (!replies.length) {
    html += '<div class="empty" style="padding:26px 16px"><span class="big">💬</span>' +
      (isQuestion ? "まだ回答がありません。最初の回答者になりませんか？" : "まだコメントがありません。") + '</div>';
  } else {
    html += replies.map(r => replyHtml(r, post, isOwner, isQuestion)).join("");
  }

  const draft = state.replyDrafts[post.id] || "";
  html += '' +
  '<div class="card">' +
    '<div style="font-size:13px;font-weight:800;margin-bottom:9px">' +
      (isQuestion ? "この質問に回答する" : "コメントする") + '</div>' +
    '<textarea id="reply-input" data-field="reply" data-id="' + esc(post.id) + '" ' +
      'style="width:100%;min-height:110px;padding:11px 13px;border-radius:11px;border:1px solid var(--border);font-size:15px;line-height:1.7;outline:none;resize:vertical" ' +
      'placeholder="' + (isQuestion ? "あなたの専門から見た答えを書いてください" : "感想や補足をどうぞ") + '">' + esc(draft) + '</textarea>' +
    '<div style="display:flex;justify-content:flex-end;margin-top:10px">' +
      '<button class="btn" data-action="submit-reply" data-id="' + esc(post.id) + '">' +
        (isQuestion ? "回答を投稿" : "コメントする") + '</button>' +
    '</div>' +
  '</div>';

  html += '</div>';
  return html;
}

function replyHtml(reply, post, isOwner, isQuestion) {
  const author = Store.user(reply.authorId);
  const liked = reply.likes.indexOf(Store.data.currentUserId) >= 0;
  const isBest = post.bestReplyId === reply.id;

  let actions = statLike(reply.likes.length, liked, "like-reply", reply.id);
  if (isQuestion && isOwner) {
    actions += '<button class="btn ghost sm" style="margin-left:auto" ' +
      'data-action="select-best" data-post="' + esc(post.id) + '" data-id="' + esc(reply.id) + '">' +
      (isBest ? "選定を取り消す" : "ベストアンサーにする") + '</button>';
  }

  return '' +
  '<div class="reply' + (isBest ? " best" : "") + '">' +
    (isBest ? '<div class="best-flag">' + ICON.award + 'ベストアンサー</div>' : "") +
    '<div style="display:flex;align-items:center;gap:9px">' +
      '<button class="avatar" style="width:34px;height:34px;font-size:18px" data-action="open-profile" data-id="' + esc(author.id) + '">' + esc(author.emoji) + '</button>' +
      '<div style="flex:1;min-width:0">' + userLineHtml(author, reply.createdAt) + '</div>' +
    '</div>' +
    '<div class="reply-body">' + escMultiline(reply.body) + '</div>' +
    '<div class="reply-foot">' + actions + '</div>' +
  '</div>';
}

/* --- 画面: 専門家一覧 --- */

function renderExperts() {
  const meId = Store.data.currentUserId;
  let users = Store.users().filter(u => u.id !== meId);
  if (state.expertField) users = users.filter(u => u.fields.indexOf(state.expertField) >= 0);

  // 認定済みを上に、その中でフォロワー数の多い順
  users.sort((a, b) => {
    if (a.verified !== b.verified) return a.verified ? -1 : 1;
    return Store.followerCount(b.id) - Store.followerCount(a.id);
  });

  const cats = Store.categories();
  let html = '' +
  '<div class="chip-row" style="padding-top:12px">' +
    '<button class="chip ' + (state.expertField === null ? "active" : "") + '" data-action="expert-field" data-value="">すべて</button>' +

  '</div>';

  if (!users.length) {
    html += '<div class="empty"><span class="big">🔍</span>この分野の専門家はまだ登録されていません。</div>';
    return html;
  }

  html += '<div class="list">' + users.map(u => {
    const following = Store.isFollowing(meId, u.id);
    const fieldNames = u.fields.map(f => {
      const c = Store.category(f);
      return c ? '<span class="fieldtag">' + esc(c.emoji + " " + c.name) + '</span>' : "";
    }).join("");

    return '' +
    '<div class="card expert-card">' +
      '<button class="avatar" data-action="open-profile" data-id="' + esc(u.id) + '">' + esc(u.emoji) + '</button>' +
      '<div class="col" data-action="open-profile" data-id="' + esc(u.id) + '">' +
        userLineHtml(u, null) +
        '<div class="expert-bio">' + esc(u.bio) + '</div>' +
        (fieldNames ? '<div class="fields">' + fieldNames + '</div>' : "") +
        '<div class="meta" style="margin-top:7px">フォロワー ' + Store.followerCount(u.id) +
          ' ・ 投稿 ' + Store.postsBy(u.id).length + '</div>' +
      '</div>' +
      '<button class="btn sm ' + (following ? "ghost" : "") + '" data-action="follow" data-id="' + esc(u.id) + '">' +
        (following ? "フォロー中" : "フォロー") + '</button>' +
    '</div>';
  }).join("") + '</div>';

  return html;
}

/* --- 画面: プロフィール --- */

function renderProfile() {
  const user = Store.user(state.route.id);
  if (!user) return '<div class="empty">ユーザーが見つかりませんでした。</div>';

  const meId = Store.data.currentUserId;
  const isMe = user.id === meId;
  const following = Store.isFollowing(meId, user.id);
  const posts = Store.postsBy(user.id);

  const fieldNames = user.fields.map(f => {
    const c = Store.category(f);
    return c ? '<span class="fieldtag">' + esc(c.emoji + " " + c.name) + '</span>' : "";
  }).join("");

  let html = '' +
  '<div class="profile-head">' +
    '<div class="profile-top">' +
      avatarHtml(user, "lg") +
      '<div style="flex:1;min-width:0">' +
        '<div class="profile-name">' + esc(user.name) + (user.verified ? verifiedMark() : "") + '</div>' +
        '<div class="handle">@' + esc(user.handle) + '</div>' +
      '</div>' +
      (isMe
        ? '<button class="btn ghost sm" data-action="open-accounts">アカウント切替</button>'
        : '<button class="btn sm ' + (following ? "ghost" : "") + '" data-action="follow" data-id="' + esc(user.id) + '">' +
            (following ? "フォロー中" : "フォロー") + '</button>') +
    '</div>' +
    '<div style="margin-top:12px;font-size:14px;line-height:1.75">' + escMultiline(user.bio) + '</div>' +
    (fieldNames ? '<div class="fields">' + fieldNames + '</div>' : "") +
    (user.verified && user.verifiedNote
      ? '<div class="verified-note"><b>専門家認定</b>　' + esc(user.verifiedNote) + '</div>'
      : (isMe ? '<div class="verified-note" style="background:var(--surface-2);border-color:var(--border);color:var(--muted)">まだ専門家認定を受けていません。得意分野の記事や回答を投稿すると申請できるようになります。</div>' : "")) +
    '<div class="counts">' +
      '<div><b>' + Store.followingCount(user.id) + '</b> <span>フォロー中</span></div>' +
      '<div><b>' + Store.followerCount(user.id) + '</b> <span>フォロワー</span></div>' +
      '<div><b>' + posts.length + '</b> <span>投稿</span></div>' +
    '</div>' +
  '</div>';

  html += '<div class="section-title">' + (isMe ? "あなたの投稿" : "投稿") + '</div>';
  if (!posts.length) {
    html += '<div class="empty" style="padding:30px 16px"><span class="big">✍️</span>まだ投稿がありません。</div>';
  } else {
    html += '<div class="list" style="padding-top:2px">' + posts.map(postCardHtml).join("") + '</div>';
  }
  return html;
}

/* --- 画面: 通知 --- */

const NOTI_TEXT = {
  follow: name => '<b>' + name + '</b> さんがあなたをフォローしました',
  like:   (name, title) => '<b>' + name + '</b> さんが「' + title + '」にいいねしました',
  reply:  (name, title) => '<b>' + name + '</b> さんが「' + title + '」に回答・コメントしました',
  best:   (name, title) => 'あなたの回答が「' + title + '」のベストアンサーに選ばれました'
};

function renderNotifications() {
  const list = Store.myNotifications();
  if (!list.length) {
    return '<div class="empty"><span class="big">🔔</span>通知はまだありません。<br>専門家をフォローしたり投稿すると、ここに届きます。</div>';
  }

  return list.map(n => {
    const actor = Store.user(n.actorId);
    const post = n.postId ? Store.post(n.postId) : null;
    const name = esc(actor ? actor.name : "退会したユーザー");
    const title = esc(excerpt(post ? post.title : "", 24));
    const fn = NOTI_TEXT[n.type];
    const text = fn ? fn(name, title) : "";
    const target = post
      ? 'data-action="open-post" data-id="' + esc(post.id) + '"'
      : (actor ? 'data-action="open-profile" data-id="' + esc(actor.id) + '"' : "");

    return '<button class="noti' + (n.read ? "" : " unread") + '" ' + target + '>' +
      (actor ? avatarHtml(actor) : '<span class="avatar">🔔</span>') +
      '<div class="noti-text">' + text +
        '<div class="meta">' + timeAgo(n.createdAt) + '</div>' +
      '</div>' +
      (n.read ? "" : '<span class="noti-dot"></span>') +
    '</button>';
  }).join("");
}

/* --- トップバー / タブバー / オーバーレイ --- */

function renderTopbar() {
  const r = state.route;
  const me = Store.me();
  const showBack = (r.name === "post" || (r.name === "profile" && r.id !== me.id));

  const titles = {
    home: "", post: "投稿", compose: "新しい投稿",
    experts: "専門家をさがす", notifications: "通知", profile: "プロフィール"
  };

  let left;
  if (showBack) {
    left = '<button class="iconbtn" data-action="back" aria-label="戻る">' + ICON.back + '</button>' +
           '<div class="topbar-title">' + esc(titles[r.name] || "") + '</div>';
  } else if (r.name === "home") {
    left = '<div class="brand"><span class="brand-mark">K</span>Knowl</div><div class="spacer"></div>';
  } else {
    left = '<div class="topbar-title">' + esc(titles[r.name] || "") + '</div>';
  }

  return left +
    '<button class="account-btn" data-action="open-accounts">' +
      '<span class="avatar">' + esc(me.emoji) + '</span>' +
      esc(me.name) + ' ' + ICON.switchIcon +
    '</button>';
}

function renderTabbar() {
  const unread = Store.unreadCount();
  const r = state.route.name;
  const me = Store.me();
  const items = [
    { key: "home",          label: "ホーム",   icon: ICON.home,  route: { name: "home" } },
    { key: "experts",       label: "専門家",   icon: ICON.users, route: { name: "experts" } },
    { key: "compose",       label: "投稿",     icon: null,       route: { name: "compose" } },
    { key: "notifications", label: "通知",     icon: ICON.bell,  route: { name: "notifications" } },
    { key: "profile",       label: "マイページ", icon: ICON.user,  route: { name: "profile", id: me.id } }
  ];

  return items.map(it => {
    const active = (it.key === "profile")
      ? (r === "profile" && state.route.id === me.id)
      : r === it.key;
    const inner = it.key === "compose"
      ? '<span class="compose-dot">' + ICON.plus + '</span>'
      : it.icon;
    const badge = (it.key === "notifications" && unread)
      ? '<span class="tab-badge">' + (unread > 9 ? "9+" : unread) + '</span>' : "";
    return '<button class="tab ' + (active ? "active" : "") + (it.key === "compose" ? " tab-compose" : "") + '" ' +
      'data-action="nav" data-route="' + it.key + '">' + inner + badge +
      '<span>' + it.label + '</span></button>';
  }).join("");
}

function renderLayer() {
  const layer = document.getElementById("layer");
  let html = "";

  if (state.sheet === "accounts") {
    const meId = Store.data.currentUserId;
    html += '<div class="overlay" data-action="close-sheet">' +
      '<div class="sheet" data-stop="1">' +
        '<div class="sheet-grip"></div>' +
        '<div class="sheet-title">アカウントを切り替える</div>' +
        '<div class="sheet-sub">プロトタイプではログインの代わりに、誰として見るかをここで切り替えます。' +
          'フォローや通知の動きは、切り替えて試すと分かりやすくなります。</div>' +
        Store.users().map(u =>
          '<button class="sheet-item ' + (u.id === meId ? "current" : "") + '" data-action="switch-user" data-id="' + esc(u.id) + '">' +
            avatarHtml(u) +
            '<div style="flex:1;min-width:0">' + userLineHtml(u, null) +
              '<div class="meta">' + esc(excerpt(u.bio, 34)) + '</div></div>' +
            (u.id === meId ? '<span class="verified-badge" style="background:var(--primary)">' + ICON.check + '</span>' : "") +
          '</button>').join("") +
        '<div style="padding:14px 18px 0;border-top:1px solid var(--border);margin-top:10px">' +
          '<button class="btn ghost block" data-action="reset-data">デモデータを初期状態に戻す</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  if (state.toast) {
    html += '<div class="toast">' + esc(state.toast) + '</div>';
  }
  layer.innerHTML = html;
}

function render() {
  document.getElementById("topbar").innerHTML = renderTopbar();
  document.getElementById("tabbar").innerHTML = renderTabbar();

  let body = "";
  switch (state.route.name) {
    case "home":          body = renderHome(); break;
    case "post":          body = renderPost(); break;
    case "compose":       body = renderCompose(); break;
    case "experts":       body = renderExperts(); break;
    case "profile":       body = renderProfile(); break;
    case "notifications": body = renderNotifications(); break;
    default:              body = renderHome();
  }
  document.getElementById("view").innerHTML = body;
  renderLayer();
}

/* ---------------------------------------------------------------
   イベント（ルート要素での委譲でまとめて受ける）
   --------------------------------------------------------------- */

function markNotificationsRead() {
  const meId = Store.data.currentUserId;
  let changed = false;
  Store.notifications().forEach(n => {
    if (n.userId === meId && !n.read) { n.read = true; changed = true; }
  });
  if (changed) Store.save();
}

document.addEventListener("click", function (ev) {
  const el = ev.target.closest("[data-action]");
  if (!el) return;

  // シート内のクリックが背景の close-sheet まで届かないようにする
  if (el.dataset.action === "close-sheet" && ev.target.closest("[data-stop]")) return;

  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case "nav": {
      const key = el.dataset.route;
      if (key === "notifications") {
        // 未読は開いた瞬間に既読化するが、この描画では未読の色を残す
        go({ name: "notifications" });
        setTimeout(() => { markNotificationsRead(); render(); }, 900);
      } else if (key === "profile") {
        go({ name: "profile", id: Store.data.currentUserId });
      } else {
        go({ name: key });
      }
      break;
    }
    case "back":
      go({ name: "home" });
      break;
    case "open-post":
      ev.stopPropagation();
      go({ name: "post", id: id });
      break;
    case "open-profile":
      ev.stopPropagation();
      go({ name: "profile", id: id });
      break;
    case "home-tab":
      state.homeTab = el.dataset.value;
      render();
      break;
    case "home-category":
      state.homeCategory = el.dataset.value || null;
      render();
      break;
    case "home-sort":
      state.homeSort = el.dataset.value;
      render();
      break;
    case "expert-field":
      state.expertField = el.dataset.value || null;
      render();
      break;
    case "like-post":
      ev.stopPropagation();
      Actions.toggleLikePost(id);
      render();
      break;
    case "like-reply":
      ev.stopPropagation();
      Actions.toggleLikeReply(id);
      render();
      break;
    case "follow": {
      ev.stopPropagation();
      const wasFollowing = Store.isFollowing(Store.data.currentUserId, id);
      Actions.toggleFollow(id);
      const u = Store.user(id);
      toast(wasFollowing ? "フォローを解除しました" : u.name + " さんをフォローしました");
      render();
      break;
    }
    case "compose-type":
      state.compose.type = el.dataset.value;
      render();
      break;
    case "submit-post": {
      const c = state.compose;
      if (!c.title.trim()) { toast("タイトルを入力してください"); return; }
      if (!c.body.trim())  { toast(c.type === "question" ? "質問の内容を入力してください" : "本文を入力してください"); return; }
      const post = Actions.createPost(c);
      state.compose = { type: c.type, title: "", body: "", categoryId: c.categoryId, tags: "" };
      toast(post.type === "question" ? "質問を投稿しました" : "記事を公開しました");
      go({ name: "post", id: post.id });
      break;
    }
    case "submit-reply": {
      const text = state.replyDrafts[id] || "";
      if (!text.trim()) { toast("本文を入力してください"); return; }
      Actions.addReply(id, text);
      delete state.replyDrafts[id];
      const post = Store.post(id);
      toast(post.type === "question" ? "回答を投稿しました" : "コメントしました");
      render();
      break;
    }
    case "select-best":
      Actions.selectBest(el.dataset.post, id);
      toast(Store.post(el.dataset.post).bestReplyId ? "ベストアンサーに選びました" : "選定を取り消しました");
      render();
      break;
    case "open-accounts":
      state.sheet = "accounts";
      renderLayer();
      break;
    case "close-sheet":
      state.sheet = null;
      renderLayer();
      break;
    case "switch-user": {
      Actions.switchUser(id);
      state.sheet = null;
      const u = Store.me();
      toast(u.name + " として表示中");
      if (state.route.name === "profile") state.route = { name: "profile", id: u.id };
      render();
      break;
    }
    case "reset-data":
      Store.reset();
      state.sheet = null;
      state.route = { name: "home" };
      state.homeTab = "all";
      state.homeCategory = null;
      state.replyDrafts = {};
      state.compose = { type: "question", title: "", body: "", categoryId: "it", tags: "" };
      toast("デモデータを初期状態に戻しました");
      render();
      break;
  }
});

// フォーム入力を state に控えておく（再描画で消えないようにするため）
document.addEventListener("input", function (ev) {
  const el = ev.target.closest("[data-field]");
  if (!el) return;
  const field = el.dataset.field;
  if (field === "reply") {
    state.replyDrafts[el.dataset.id] = el.value;
  } else if (Object.prototype.hasOwnProperty.call(state.compose, field)) {
    state.compose[field] = el.value;
  }
});
document.addEventListener("change", function (ev) {
  const el = ev.target.closest("[data-field]");
  if (!el || el.tagName !== "SELECT") return;
  if (Object.prototype.hasOwnProperty.call(state.compose, el.dataset.field)) {
    state.compose[el.dataset.field] = el.value;
  }
});

/* --- 起動 --- */
Store.load();
render();
</script>
</body>
</html>

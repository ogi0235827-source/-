<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>どうぶつタッチ！</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 50%, #C8F0FF 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      height: 100dvh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* 雲の背景 */
    .cloud {
      position: absolute;
      background: white;
      border-radius: 50px;
      opacity: 0.7;
      animation: driftCloud linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud::before {
      width: 60%; height: 180%;
      top: -70%; left: 15%;
    }
    .cloud::after {
      width: 40%; height: 140%;
      top: -55%; right: 15%;
    }
    @keyframes driftCloud {
      from { transform: translateX(-200px); }
      to   { transform: translateX(calc(100vw + 200px)); }
    }

    /* HUDバー */
    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(6px);
    }
    #score-box, #timer-box {
      background: white;
      border-radius: 20px;
      padding: 6px 18px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      text-align: center;
      min-width: 90px;
    }
    .hud-label {
      font-size: 11px;
      color: #888;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #score {
      font-size: 28px;
      font-weight: bold;
      color: #FF6B6B;
      line-height: 1.1;
    }
    #timer {
      font-size: 28px;
      font-weight: bold;
      color: #4ECDC4;
      line-height: 1.1;
    }
    #timer.urgent {
      color: #FF3B3B;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.2); }
    }

    /* レベルバッジ */
    #level-badge {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
      border-radius: 50%;
      width: 48px; height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      font-size: 9px;
      font-weight: bold;
    }
    #level-num { font-size: 18px; line-height: 1; }

    /* 動物カード */
    .animal-card {
      position: absolute;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      transition: transform 0.1s;
      animation: jumpIn ease-out forwards;
      will-change: transform;
      padding: 6px 4px 4px;
      gap: 2px;
    }
    .animal-card:active {
      transform: scale(0.88) rotate(-3deg);
    }
    .animal-emoji {
      line-height: 1;
    }
    .animal-name {
      font-weight: bold;
      color: #555;
      white-space: nowrap;
    }

    @keyframes jumpIn {
      0%   { bottom: -140px; opacity: 0; transform: scale(0.5) rotate(-8deg); }
      12%  { opacity: 1; transform: scale(1.15) rotate(4deg); }
      22%  { transform: scale(0.95) rotate(-2deg); }
      30%  { transform: scale(1.05) rotate(1deg); }
      38%  { transform: scale(1) rotate(0deg); }
      80%  { opacity: 1; }
      100% { bottom: 110%; opacity: 0; }
    }

    /* タップエフェクト */
    .heart-particle {
      position: absolute;
      pointer-events: none;
      z-index: 200;
      font-size: 22px;
      animation: heartFly 0.7s ease-out forwards;
    }
    @keyframes heartFly {
      0%   { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
    }
    .animal-tap-effect {
      position: absolute;
      pointer-events: none;
      z-index: 200;
      font-size: 2.2em;
      animation: tapBurst 0.55s ease-out forwards;
    }
    @keyframes tapBurst {
      0%   { transform: scale(0.6); opacity: 1; }
      50%  { transform: scale(1.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .score-pop {
      position: absolute;
      pointer-events: none;
      font-size: 22px;
      font-weight: bold;
      color: #FF6B6B;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      z-index: 201;
      animation: scoreFly 0.9s ease-out forwards;
    }
    @keyframes scoreFly {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-65px) scale(1.3); opacity: 0; }
    }

    /* スタート画面 / ゲームオーバー画面 */
    #start-screen, #gameover-screen {
      position: absolute;
      inset: 0;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(135, 206, 235, 0.85);
      backdrop-filter: blur(8px);
    }
    .screen-card {
      background: white;
      border-radius: 30px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 320px;
      width: 88%;
    }
    .screen-title  { font-size: 42px; margin-bottom: 8px; }
    .screen-subtitle { font-size: 16px; color: #888; margin-bottom: 24px; }
    .big-btn {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      font-size: 22px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .big-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .btn-start { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; }
    .btn-retry { background: linear-gradient(135deg, #4ECDC4, #44A9A2); color: white; }
    .result-score { font-size: 56px; font-weight: bold; color: #FF6B6B; line-height: 1; }
    .result-label { font-size: 14px; color: #aaa; margin-bottom: 4px; }
    .result-best  { font-size: 18px; color: #FFD700; margin: 8px 0 0; }
    .medal        { font-size: 48px; margin: 8px 0; }
    .instructions { font-size: 14px; color: #666; line-height: 1.8; margin: 12px 0 20px; }

    /* コンボ表示 */
    #combo-display {
      position: absolute;
      top: 80px; left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      font-size: 28px;
      font-weight: bold;
      color: #FF6B6B;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    #combo-display.show { opacity: 1; }

    /* 草地 */
    #grass {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(180deg, #7EC850 0%, #5BA032 100%);
      border-radius: 50% 50% 0 0 / 20px 20px 0 0;
      z-index: 50;
    }
    #grass::before {
      content: '';
      position: absolute;
      top: -15px; left: 0; right: 0;
      height: 30px;
      background:
        radial-gradient(ellipse 20px 15px at 10%  100%, #7EC850 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 20%  100%, #8ED860 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 30%  100%, #7EC850 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 40%  100%, #9AE870 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 50%  100%, #7EC850 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 60%  100%, #8ED860 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 70%  100%, #7EC850 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 80%  100%, #9AE870 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 90%  100%, #7EC850 50%, transparent 51%),
        radial-gradient(ellipse 20px 15px at 100% 100%, #8ED860 50%, transparent 51%);
    }
  </style>
</head>
<body>
<div id="game-container">

  <div id="grass"></div>

  <div id="hud">
    <div id="score-box">
      <div class="hud-label">スコア</div>
      <div id="score">0</div>
    </div>
    <div id="level-badge">
      <div style="font-size:9px">Lv</div>
      <div id="level-num">1</div>
    </div>
    <div id="timer-box">
      <div class="hud-label">のこり</div>
      <div id="timer">60</div>
    </div>
  </div>

  <div id="combo-display"></div>

  <!-- スタート画面 -->
  <div id="start-screen">
    <div class="screen-card">
      <div class="screen-title">🐾 どうぶつタッチ！</div>
      <div class="screen-subtitle">どうぶつをみつけてタッチ！</div>
      <div class="instructions">
        🐶 でてきた どうぶつをタッチ！<br>
        ⭐ ちいさい どうぶつは こうとく！<br>
        ✨ つづけてタッチで ボーナス！<br>
        ⏰ 60びょうチャレンジ！
      </div>
      <button class="big-btn btn-start" onclick="startGame()">あそぶ！🎉</button>
    </div>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="gameover-screen" style="display:none">
    <div class="screen-card">
      <div class="medal" id="result-medal">🥇</div>
      <div class="result-label">スコア</div>
      <div class="result-score" id="result-score">0</div>
      <div class="result-best" id="result-best"></div>
      <button class="big-btn btn-retry" onclick="startGame()">もう一度！🔄</button>
      <button class="big-btn btn-start" style="margin-top:8px;background:linear-gradient(135deg,#FF6B6B,#FF8E53)" onclick="showStart()">タイトルへ 🏠</button>
    </div>
  </div>

</div>

<script>
// ── 定数 ──────────────────────────────────────────
const GAME_TIME = 60;

const ANIMALS = [
  '🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐨','🐯','🦁',
  '🐮','🐷','🐸','🐵','🐔','🐧','🦆','🦋','🐢','🐬',
  '🦓','🦒','🐘','🦜','🦔','🐇','🦉','🐺','🐴','🦕',
];

const ANIMAL_NAMES = {
  '🐶':'いぬ','🐱':'ねこ','🐭':'ねずみ','🐰':'うさぎ','🦊':'きつね',
  '🐻':'くま','🐼':'パンダ','🐨':'コアラ','🐯':'とら','🦁':'らいおん',
  '🐮':'うし','🐷':'ぶた','🐸':'かえる','🐵':'さる','🐔':'にわとり',
  '🐧':'ペンギン','🦆':'あひる','🦋':'ちょうちょ','🐢':'かめ','🐬':'いるか',
  '🦓':'しまうま','🦒':'きりん','🐘':'ぞう','🦜':'おうむ','🦔':'ハリネズミ',
  '🐇':'うさぎ','🦉':'ふくろう','🐺':'おおかみ','🐴':'うま','🦕':'きょうりゅう',
};

const CARD_BORDER_COLORS = [
  '#FF6B6B','#FFD700','#4ECDC4','#FF9F7F',
  '#C77DFF','#5BC8F5','#FF85A2','#7EC850',
];

const HEART_PARTICLES = ['❤️','🧡','💛','💚','💙','💜','⭐','✨'];

// ── 状態 ──────────────────────────────────────────
let score = 0, timeLeft = GAME_TIME, level = 1;
let timerInterval = null, spawnTimeout = null;
let cards = [], combo = 0, comboTimer = null;
let bestScore = parseInt(localStorage.getItem('animalBest') || '0');
let running = false;

// ── AudioContext ───────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTap(freq = 600) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 2, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.25);
  } catch {}
}
function playCombo() {
  try {
    const ctx = getAudio();
    [523, 659, 784, 1047].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.07);
      gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.15);
      osc.start(ctx.currentTime + i * 0.07);
      osc.stop(ctx.currentTime + i * 0.07 + 0.15);
    });
  } catch {}
}
function playGameOver() {
  try {
    const ctx = getAudio();
    [523, 415, 330, 262].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.15);
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  } catch {}
}

// ── 雲生成 ────────────────────────────────────────
function makeClouds() {
  for (let i = 0; i < 4; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 80 + Math.random() * 80;
    c.style.cssText = `
      width:${w}px; height:${w * 0.35}px;
      top:${10 + Math.random() * 30}%;
      left:-${w + 20}px;
      animation-duration:${20 + Math.random() * 20}s;
      animation-delay:${-Math.random() * 20}s;
    `;
    document.getElementById('game-container').appendChild(c);
  }
}
makeClouds();

// ── ゲーム開始 ────────────────────────────────────
function startGame() {
  score = 0; timeLeft = GAME_TIME; level = 1; combo = 0;
  running = true;
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = GAME_TIME;
  document.getElementById('timer').classList.remove('urgent');
  document.getElementById('level-num').textContent = '1';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';

  document.querySelectorAll('.animal-card').forEach(b => b.remove());
  cards = [];

  clearInterval(timerInterval);
  clearTimeout(spawnTimeout);

  timerInterval = setInterval(tickTimer, 1000);
  scheduleSpawn();
}

function showStart() {
  running = false;
  clearInterval(timerInterval);
  clearTimeout(spawnTimeout);
  document.querySelectorAll('.animal-card').forEach(b => b.remove());
  cards = [];
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

// ── タイマー ──────────────────────────────────────
function tickTimer() {
  timeLeft--;
  const el = document.getElementById('timer');
  el.textContent = timeLeft;
  if (timeLeft <= 10) el.classList.add('urgent');
  updateLevel();
  if (timeLeft <= 0) endGame();
}

function updateLevel() {
  level = Math.min(5, Math.floor((GAME_TIME - timeLeft) / 15) + 1);
  document.getElementById('level-num').textContent = level;
}

// ── 動物スポーン ──────────────────────────────────
function scheduleSpawn() {
  spawnAnimal();
  const delay = Math.max(400, 1200 - level * 150) + Math.random() * 300;
  spawnTimeout = setTimeout(() => {
    if (running) scheduleSpawn();
  }, delay);
}

function spawnAnimal() {
  if (!running) return;
  const container = document.getElementById('game-container');
  const size = pickSize();
  const emoji = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  const name = ANIMAL_NAMES[emoji] || '';
  const borderColor = CARD_BORDER_COLORS[Math.floor(Math.random() * CARD_BORDER_COLORS.length)];
  const duration = Math.max(2.5, 6 - level * 0.5) + Math.random() * 2;
  const leftPct = 4 + Math.random() * 80;
  const emojiSize = Math.round(size * 0.55);
  const nameSize = Math.max(10, Math.round(size * 0.16));

  const card = document.createElement('div');
  card.className = 'animal-card';
  card.style.cssText = `
    width:${size}px; height:${size}px;
    left:${leftPct}%;
    border: 4px solid ${borderColor};
    animation-duration:${duration}s;
  `;

  const emojiEl = document.createElement('div');
  emojiEl.className = 'animal-emoji';
  emojiEl.style.fontSize = emojiSize + 'px';
  emojiEl.textContent = emoji;

  const nameEl = document.createElement('div');
  nameEl.className = 'animal-name';
  nameEl.style.fontSize = nameSize + 'px';
  nameEl.textContent = name;

  card.appendChild(emojiEl);
  card.appendChild(nameEl);
  card.dataset.points = sizeToPoints(size);
  card.dataset.emoji = emoji;

  card.addEventListener('pointerdown', onAnimalTap, { passive: true });
  card.addEventListener('animationend', () => {
    card.remove();
    cards = cards.filter(x => x !== card);
    if (running && combo > 0) { combo = 0; showCombo(0); }
  });

  container.appendChild(card);
  cards.push(card);
}

function pickSize() {
  const rand = Math.random();
  if (rand < 0.15) return 100 + Math.floor(Math.random() * 20); // 大
  if (rand < 0.55) return 70 + Math.floor(Math.random() * 20);  // 中
  return 48 + Math.floor(Math.random() * 14);                    // 小
}

function sizeToPoints(size) {
  if (size >= 100) return 1;
  if (size >= 70)  return 3;
  return 5;
}

// ── 動物をタップ ──────────────────────────────────
function onAnimalTap(e) {
  e.stopPropagation();
  if (!running) return;
  const card = e.currentTarget;
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  card.removeEventListener('pointerdown', onAnimalTap);
  card.remove();
  cards = cards.filter(x => x !== card);

  combo++;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { combo = 0; showCombo(0); }, 1200);

  const pts = parseInt(card.dataset.points) * (combo >= 5 ? 3 : combo >= 3 ? 2 : 1);
  score += pts;
  document.getElementById('score').textContent = score;

  showTapEffect(cx, cy, card.dataset.emoji);
  spawnHearts(cx, cy);
  showScorePop(cx, cy, pts, combo);
  playTap(440 + combo * 35);

  if (combo >= 3) {
    showCombo(combo);
    if (combo % 3 === 0) playCombo();
  }
}

function showTapEffect(x, y, emoji) {
  const el = document.createElement('div');
  el.className = 'animal-tap-effect';
  el.textContent = emoji;
  el.style.cssText = `left:${x - 22}px; top:${y - 22}px;`;
  document.getElementById('game-container').appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function spawnHearts(cx, cy) {
  const container = document.getElementById('game-container');
  const count = 5 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'heart-particle';
    el.textContent = HEART_PARTICLES[Math.floor(Math.random() * HEART_PARTICLES.length)];
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 40 + Math.random() * 50;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 20;
    el.style.cssText = `
      left:${cx - 11}px; top:${cy - 11}px;
      --dx:${dx}px; --dy:${dy}px;
      animation-delay:${Math.random() * 0.1}s;
    `;
    container.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

function showScorePop(x, y, pts, combo) {
  const el = document.createElement('div');
  el.className = 'score-pop';
  const bonus = combo >= 5 ? ' x3🔥' : combo >= 3 ? ' x2✨' : '';
  el.textContent = `+${pts}${bonus}`;
  el.style.cssText = `left:${x - 24}px; top:${y - 36}px;`;
  if (combo >= 3) {
    el.style.color = combo >= 5 ? '#FF3B3B' : '#FF9F00';
    el.style.fontSize = '26px';
  }
  document.getElementById('game-container').appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showCombo(n) {
  const el = document.getElementById('combo-display');
  if (n < 3) { el.classList.remove('show'); return; }
  el.textContent = n >= 10 ? `🔥 ${n} コンボ！！` : n >= 5 ? `✨ ${n} コンボ！` : `${n} コンボ`;
  el.classList.add('show');
}

// ── ゲーム終了 ────────────────────────────────────
function endGame() {
  running = false;
  clearInterval(timerInterval);
  clearTimeout(spawnTimeout);
  playGameOver();

  const isNew = score > bestScore;
  if (isNew) {
    bestScore = score;
    localStorage.setItem('animalBest', bestScore);
  }

  document.getElementById('result-score').textContent = score;
  document.getElementById('result-best').textContent =
    isNew ? `🎊 新記録！` : `ベスト: ${bestScore}`;
  document.getElementById('result-medal').textContent =
    score >= 300 ? '🥇' : score >= 150 ? '🥈' : score >= 50 ? '🥉' : '🎮';

  setTimeout(() => {
    document.getElementById('gameover-screen').style.display = 'flex';
  }, 600);
}
</script>
</body>
</html>

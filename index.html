<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>バブルポップ！</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 50%, #C8F0FF 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      height: 100dvh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* 雲の背景 */
    .cloud {
      position: absolute;
      background: white;
      border-radius: 50px;
      opacity: 0.7;
      animation: driftCloud linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud::before {
      width: 60%;
      height: 180%;
      top: -70%;
      left: 15%;
    }
    .cloud::after {
      width: 40%;
      height: 140%;
      top: -55%;
      right: 15%;
    }
    @keyframes driftCloud {
      from { transform: translateX(-200px); }
      to   { transform: translateX(calc(100vw + 200px)); }
    }

    /* HUDバー */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(6px);
    }
    #score-box, #timer-box {
      background: white;
      border-radius: 20px;
      padding: 6px 18px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      text-align: center;
      min-width: 90px;
    }
    .hud-label {
      font-size: 11px;
      color: #888;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #score {
      font-size: 28px;
      font-weight: bold;
      color: #FF6B6B;
      line-height: 1.1;
    }
    #timer {
      font-size: 28px;
      font-weight: bold;
      color: #4ECDC4;
      line-height: 1.1;
    }
    #timer.urgent {
      color: #FF3B3B;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.2); }
    }

    /* レベルバッジ */
    #level-badge {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      font-size: 9px;
      font-weight: bold;
    }
    #level-num {
      font-size: 18px;
      line-height: 1;
    }

    /* 泡 */
    .bubble {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      box-shadow: inset -4px -4px 12px rgba(255,255,255,0.6),
                  inset 4px 4px 12px rgba(0,0,0,0.08),
                  0 4px 15px rgba(0,0,0,0.12);
      transition: transform 0.1s;
      animation: floatUp linear forwards;
      will-change: transform;
    }
    .bubble:active {
      transform: scale(0.9);
    }
    @keyframes floatUp {
      0%   { bottom: -120px; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { bottom: 110%; opacity: 0; }
    }

    /* ポップエフェクト */
    .pop-effect {
      position: absolute;
      pointer-events: none;
      font-size: 2em;
      z-index: 200;
      animation: popOut 0.6s ease-out forwards;
    }
    @keyframes popOut {
      0%   { transform: scale(0.5); opacity: 1; }
      60%  { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .score-pop {
      position: absolute;
      pointer-events: none;
      font-size: 22px;
      font-weight: bold;
      color: #FF6B6B;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      z-index: 201;
      animation: scoreFly 0.8s ease-out forwards;
    }
    @keyframes scoreFly {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
    }

    /* スタート画面 */
    #start-screen, #gameover-screen {
      position: absolute;
      inset: 0;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(135, 206, 235, 0.85);
      backdrop-filter: blur(8px);
    }
    .screen-card {
      background: white;
      border-radius: 30px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 320px;
      width: 88%;
    }
    .screen-title {
      font-size: 42px;
      margin-bottom: 8px;
    }
    .screen-subtitle {
      font-size: 16px;
      color: #888;
      margin-bottom: 24px;
    }
    .big-btn {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      font-size: 22px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .big-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .btn-start {
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white;
    }
    .btn-retry {
      background: linear-gradient(135deg, #4ECDC4, #44A9A2);
      color: white;
    }
    .result-score {
      font-size: 56px;
      font-weight: bold;
      color: #FF6B6B;
      line-height: 1;
    }
    .result-label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .result-best {
      font-size: 18px;
      color: #FFD700;
      margin: 8px 0 0;
    }
    .medal {
      font-size: 48px;
      margin: 8px 0;
    }
    .instructions {
      font-size: 14px;
      color: #666;
      line-height: 1.7;
      margin: 12px 0 20px;
    }

    /* コンボ表示 */
    #combo-display {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      font-size: 28px;
      font-weight: bold;
      color: #FF6B6B;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #combo-display.show {
      opacity: 1;
    }

    /* 草地 */
    #grass {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(180deg, #7EC850 0%, #5BA032 100%);
      border-radius: 50% 50% 0 0 / 20px 20px 0 0;
      z-index: 50;
    }
    #grass::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 0; right: 0;
      height: 30px;
      background: radial-gradient(ellipse 20px 15px at 10% 100%, #7EC850 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 20% 100%, #8ED860 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 30% 100%, #7EC850 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 40% 100%, #9AE870 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 50% 100%, #7EC850 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 60% 100%, #8ED860 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 70% 100%, #7EC850 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 80% 100%, #9AE870 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 90% 100%, #7EC850 50%, transparent 51%),
                  radial-gradient(ellipse 20px 15px at 100% 100%, #8ED860 50%, transparent 51%);
    }
  </style>
</head>
<body>
<div id="game-container">

  <!-- 草地 -->
  <div id="grass"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="score-box">
      <div class="hud-label">スコア</div>
      <div id="score">0</div>
    </div>
    <div id="level-badge">
      <div style="font-size:9px">Lv</div>
      <div id="level-num">1</div>
    </div>
    <div id="timer-box">
      <div class="hud-label">のこり</div>
      <div id="timer">60</div>
    </div>
  </div>

  <!-- コンボ -->
  <div id="combo-display"></div>

  <!-- スタート画面 -->
  <div id="start-screen">
    <div class="screen-card">
      <div class="screen-title">🫧 バブルポップ！</div>
      <div class="screen-subtitle">泡をタップしてはじこう！</div>
      <div class="instructions">
        🎈 うかんでいる泡をタップ！<br>
        ⭐ 大きい泡は高得点！<br>
        ✨ れんぞくで点数アップ！<br>
        ⏰ 60秒でチャレンジ！
      </div>
      <button class="big-btn btn-start" onclick="startGame()">あそぶ！🎉</button>
    </div>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="gameover-screen" style="display:none">
    <div class="screen-card">
      <div class="medal" id="result-medal">🥇</div>
      <div class="result-label">スコア</div>
      <div class="result-score" id="result-score">0</div>
      <div class="result-best" id="result-best"></div>
      <button class="big-btn btn-retry" onclick="startGame()">もう一度！🔄</button>
      <button class="big-btn btn-start" style="margin-top:8px;background:linear-gradient(135deg,#FF6B6B,#FF8E53)" onclick="showStart()">タイトルへ 🏠</button>
    </div>
  </div>

</div>

<script>
// ── 定数 ──────────────────────────────────────────
const GAME_TIME = 60;
const EMOJIS = ['🌸','⭐','🍭','🌈','🦋','🐸','🌻','🍎','🐶','🐱','🎀','🍩','🦄','🎸','🏀'];
const BUBBLE_COLORS = [
  ['#FF6B6B','#FF8E8E'],['#FFD700','#FFE566'],['#4ECDC4','#7EDEDA'],
  ['#FF9F7F','#FFBE9F'],['#C77DFF','#D9A0FF'],['#74D7CB','#9FE5DF'],
  ['#FF85A2','#FFB3C6'],['#5BC8F5','#8CDBF8'],
];

// ── 状態 ──────────────────────────────────────────
let score = 0, timeLeft = GAME_TIME, level = 1;
let timerInterval = null, spawnInterval = null;
let bubbles = [], combo = 0, comboTimer = null;
let bestScore = parseInt(localStorage.getItem('bubbleBest') || '0');
let running = false;

// ── AudioContext（サウンド） ───────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playPop(freq = 600) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.8, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch {}
}
function playCombo() {
  try {
    const ctx = getAudio();
    [523, 659, 784, 1047].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.07);
      gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.15);
      osc.start(ctx.currentTime + i * 0.07);
      osc.stop(ctx.currentTime + i * 0.07 + 0.15);
    });
  } catch {}
}
function playGameOver() {
  try {
    const ctx = getAudio();
    [523, 415, 330, 262].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.15);
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  } catch {}
}

// ── 雲生成 ────────────────────────────────────────
function makeClouds() {
  for (let i = 0; i < 4; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 80 + Math.random() * 80;
    c.style.cssText = `
      width:${w}px; height:${w * 0.35}px;
      top:${10 + Math.random() * 30}%;
      left:-${w + 20}px;
      animation-duration:${20 + Math.random() * 20}s;
      animation-delay:${-Math.random() * 20}s;
    `;
    document.getElementById('game-container').appendChild(c);
  }
}
makeClouds();

// ── ゲーム開始 ────────────────────────────────────
function startGame() {
  score = 0; timeLeft = GAME_TIME; level = 1; combo = 0;
  running = true;
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = GAME_TIME;
  document.getElementById('timer').classList.remove('urgent');
  document.getElementById('level-num').textContent = '1';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';

  // 既存の泡を削除
  document.querySelectorAll('.bubble').forEach(b => b.remove());
  bubbles = [];

  clearInterval(timerInterval);
  clearInterval(spawnInterval);

  timerInterval = setInterval(tickTimer, 1000);
  scheduleSpawn();
}

function showStart() {
  running = false;
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  document.querySelectorAll('.bubble').forEach(b => b.remove());
  bubbles = [];
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

// ── タイマー ──────────────────────────────────────
function tickTimer() {
  timeLeft--;
  const el = document.getElementById('timer');
  el.textContent = timeLeft;
  if (timeLeft <= 10) el.classList.add('urgent');
  updateLevel();
  if (timeLeft <= 0) endGame();
}

function updateLevel() {
  level = Math.min(5, Math.floor((GAME_TIME - timeLeft) / 15) + 1);
  document.getElementById('level-num').textContent = level;
}

// ── 泡スポーン ────────────────────────────────────
function scheduleSpawn() {
  spawnBubble();
  const delay = Math.max(400, 1200 - level * 150);
  spawnInterval = setTimeout(() => {
    if (running) scheduleSpawn();
  }, delay + Math.random() * 300);
}

function spawnBubble() {
  if (!running) return;
  const container = document.getElementById('game-container');
  const size = pickSize();
  const [c1, c2] = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
  const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  const duration = Math.max(2.5, 6 - level * 0.5) + Math.random() * 2;
  const leftPct = 5 + Math.random() * 80;

  const b = document.createElement('div');
  b.className = 'bubble';
  b.style.cssText = `
    width:${size}px; height:${size}px;
    left:${leftPct}%;
    background: radial-gradient(circle at 35% 35%, white 0%, ${c1} 40%, ${c2} 100%);
    font-size:${size * 0.42}px;
    animation-duration:${duration}s;
  `;
  b.textContent = emoji;
  b.dataset.points = sizeToPoints(size);
  b.addEventListener('pointerdown', onBubblePop, { passive: true });
  b.addEventListener('animationend', () => {
    b.remove();
    bubbles = bubbles.filter(x => x !== b);
    if (running && combo > 0) {
      combo = 0;
      showCombo(0);
    }
  });

  container.appendChild(b);
  bubbles.push(b);
}

function pickSize() {
  const rand = Math.random();
  if (rand < 0.15) return 90 + Math.floor(Math.random() * 30); // 大 (少ない)
  if (rand < 0.55) return 60 + Math.floor(Math.random() * 20); // 中
  return 40 + Math.floor(Math.random() * 15);                   // 小 (多い)
}

function sizeToPoints(size) {
  if (size >= 90) return 1;
  if (size >= 60) return 3;
  return 5;
}

// ── 泡をタップ ────────────────────────────────────
function onBubblePop(e) {
  e.stopPropagation();
  if (!running) return;
  const b = e.currentTarget;
  const rect = b.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  b.removeEventListener('pointerdown', onBubblePop);
  b.remove();
  bubbles = bubbles.filter(x => x !== b);

  combo++;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { combo = 0; showCombo(0); }, 1200);

  const pts = parseInt(b.dataset.points) * (combo >= 5 ? 3 : combo >= 3 ? 2 : 1);
  score += pts;
  document.getElementById('score').textContent = score;

  // エフェクト
  showPopEffect(cx, cy, b.textContent);
  showScorePop(cx, cy, pts, combo);
  playPop(400 + combo * 40);

  if (combo >= 3) {
    showCombo(combo);
    if (combo % 3 === 0) playCombo();
  }
}

function showPopEffect(x, y, emoji) {
  const el = document.createElement('div');
  el.className = 'pop-effect';
  el.textContent = emoji;
  el.style.cssText = `left:${x - 20}px; top:${y - 20}px;`;
  document.getElementById('game-container').appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showScorePop(x, y, pts, combo) {
  const el = document.createElement('div');
  el.className = 'score-pop';
  const bonus = combo >= 5 ? ' x3🔥' : combo >= 3 ? ' x2✨' : '';
  el.textContent = `+${pts}${bonus}`;
  el.style.cssText = `left:${x - 20}px; top:${y - 30}px;`;
  if (combo >= 3) {
    el.style.color = combo >= 5 ? '#FF3B3B' : '#FF9F00';
    el.style.fontSize = '26px';
  }
  document.getElementById('game-container').appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showCombo(n) {
  const el = document.getElementById('combo-display');
  if (n < 3) { el.classList.remove('show'); return; }
  el.textContent = n >= 10 ? `🔥 ${n} コンボ！！` : n >= 5 ? `✨ ${n} コンボ！` : `${n} コンボ`;
  el.classList.add('show');
}

// ── ゲーム終了 ────────────────────────────────────
function endGame() {
  running = false;
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  playGameOver();

  const isNew = score > bestScore;
  if (isNew) {
    bestScore = score;
    localStorage.setItem('bubbleBest', bestScore);
  }

  document.getElementById('result-score').textContent = score;
  document.getElementById('result-best').textContent =
    isNew ? `🎊 新記録！` : `ベスト: ${bestScore}`;
  document.getElementById('result-medal').textContent =
    score >= 300 ? '🥇' : score >= 150 ? '🥈' : score >= 50 ? '🥉' : '🎮';

  setTimeout(() => {
    document.getElementById('gameover-screen').style.display = 'flex';
  }, 600);
}
</script>
</body>
</html>
